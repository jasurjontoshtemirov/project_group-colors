<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
        }
       
        .all{
            display: flex;
        }
        .box1{
            width: 50%;
            height: 50vh;
            background-color: red;
        }
        .box2{
            width: 50%;
            height: 50vh;
            background-color: blue;
            
        }

        .all2{
            display: flex;
        }
        .box3{
            width: 50%;
            height: 50vh;
            background: linear-gradient(blue, rgb(139, 139, 160), blue);
            font-size:20px; 
            transition: 0.4s;
            
        }

        .box3:hover{
            background-color: rgb(255, 0, 0);
            transition: 0.4s;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 30px;
        }
        .box4{
            width: 50%;
            height: 50vh;
            background-color: rgb(140, 199, 30);
            
        }
        .all > div,.all2 > div{
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="all">
            <div class="box1">Jasujron</div>
            <div class="box2">Mirzabek</div>
        </div>

        <div class="all2">
                 <div class="box3">Jonibek</div>
        <div class="box4">Shohimardon</div>
        </div>

   
    </div>
</body>

</html>
